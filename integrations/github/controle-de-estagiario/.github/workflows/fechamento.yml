name: Fechamento mensal

# Publica fechamento/AAAA-MM.json para o mês anterior (definitivo) e o corrente (parcial),
# uma vez por dia. O Simulador Financeiro lê esse arquivo no fechamento do mês.
#
# 06:00 UTC = 03:00 America/Belem. Roda antes do cron do Simulador (06:15 UTC), que dispara no
# 4º último dia do mês.
#
# Só faz commit quando algum número mudou — o mês anterior estabiliza e para de gerar ruído.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      competencia:
        description: 'Competência específica (AAAA-MM). Vazio = mês anterior + corrente.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fechamento
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar fechamento
        env:
          FECHAMENTO_SUPABASE_URL: ${{ secrets.FECHAMENTO_SUPABASE_URL }}
          FECHAMENTO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FECHAMENTO_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.competencia }}" ]; then
            node scripts/fechamento/gerar.mjs --competencia=${{ inputs.competencia }}
          else
            node scripts/fechamento/gerar.mjs
          fi

      - name: Commitar
        run: |
          if [ -z "$(git status --porcelain fechamento)" ]; then
            echo "nada mudou — sem commit"
            exit 0
          fi
          git config user.name  'fechamento-bot'
          git config user.email 'fechamento-bot@users.noreply.github.com'
          git add fechamento
          git commit -m "chore(fechamento): $(date -u +%Y-%m) atualizado pela Action"
          git push
